name: Android APK

on:
  pull_request:
  push:
    branches:
      - master
      - agent/android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android arm64 APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Rust 1.92
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add aarch64-linux-android

      - name: Install Android SDK and NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install cargo-apk
        run: >-
          cargo install
          --git https://github.com/parasyte/cargo-apk.git
          --rev 282639508eeed7d73f2e1eaeea042da2716436d5
          cargo-apk

      - name: Build release APK
        run: cargo apk build --release -p dmo-android --lib

      - name: Collect APK
        run: |
          mkdir -p dist
          find target/release/apk -type f -name '*.apk' -exec cp '{}' dist/DMO-android-arm64.apk ';'
          test -s dist/DMO-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DMO-android-arm64
          path: dist/DMO-android-arm64.apk
          if-no-files-found: error
