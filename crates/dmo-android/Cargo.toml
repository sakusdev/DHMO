[package]
name = "dmo-android"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
dmo-gui = { path = "../dmo-gui" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
jni = "0.21.1"
log = "0.4.33"
winit = { version = "0.30.13", default-features = false }

[package.metadata.android]
package = "org.sakus.dmo"
apk_name = "dmo"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

[[package.metadata.android.uses_feature]]
name = "android.software.midi"
required = false

[package.metadata.android.application]
label = "DMO"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "landscape"
exported = true
resizeable_activity = true
launch_mode = "singleTop"
