[package]
name = "dmo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dmo-gui"
path = "src/main.rs"

[dependencies]
dmo-audio = { path = "../dmo-audio" }
dmo-core = { path = "../dmo-core" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
midir = "0.11.0"
rfd = "0.17.2"

[features]
screenshot = ["eframe/__screenshot"]

[lints]
workspace = true
